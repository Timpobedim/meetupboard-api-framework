[project]
name = "meetupboard-api-framework"
version = "1.0.0"
description = "Фреймворк API-автотестов MeetupBoard: кодогенерация клиента, Pydantic, Builder + Faker, PyPika, Allure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "meetupboard-client",
    "pytest>=8.4",
    "pytest-xdist>=3.8",
    "allure-pytest>=2.15",
    "requests>=2.32",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "faker>=37",
    "pypika>=0.48",
    "psycopg[binary]>=3.2",
    "assertpy>=1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.17",
    "types-requests>=2.32",
]

[tool.uv]
package = false

[tool.uv.sources]
# Клиент сгенерирован openapi-generator (scripts/codegen.sh) и лежит в репозитории.
meetupboard-client = { path = "clients/meetupboard_client", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-n", "4", "--alluredir=allure-results", "--clean-alluredir"]
xfail_strict = true

[tool.ruff]
line-length = 110
target-version = "py312"
# Сгенерированный код не правится руками — его пересоздаёт scripts/codegen.sh.
extend-exclude = ["clients"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "PT", "RUF"]
# RUF001-003: в русских строках есть кириллица, похожая на латиницу, — это нормально.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"framework/builders/users.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["framework", "scripts"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["framework", "scripts"]
plugins = ["pydantic.mypy"]
# Клиент установлен в режиме editable через import hook, по которому mypy не ходит, — путь к исходникам явно.
mypy_path = "clients/meetupboard_client"

[[tool.mypy.overrides]]
module = ["pypika", "pypika.*", "assertpy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Сгенерированный клиент используется, но не проверяется: его код — зона генератора.
module = ["meetupboard_client", "meetupboard_client.*"]
follow_imports = "silent"
implicit_reexport = true

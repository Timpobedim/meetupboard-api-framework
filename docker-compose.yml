# Стенд для API-тестов. Тестируемый сервис MeetupBoard собирается из соседней папки портфолио
# (03-python-backend); в отдельном репозитории вместо build подставляется образ из registry.
# Порты сдвинуты (8003, 5433), чтобы стенд не мешал самому MeetupBoard, запущенному из его папки.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetups
    ports:
      - "5433:5432"  # тесты проверяют записи в БД напрямую — через PyPika
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  aut:
    image: ${AUT_IMAGE:-meetupboard:local}
    build: ../../03-python-backend/meetups-django-ninja
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/meetups
      SECRET_KEY: test-stand-secret-key
      JWT_SECRET_KEY: test-stand-jwt-signing-key-at-least-32-bytes-long
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1,aut
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy

  # Тесты в контейнере — так же, как их запускает CI: docker compose run --rm tests
  tests:
    build: .
    profiles: ["tests"]
    environment:
      MEETUPBOARD_API_URL: http://aut:8000
      MEETUPBOARD_DB_DSN: postgresql://postgres:postgres@db:5432/meetups
    volumes:
      - ./allure-results:/app/allure-results
    depends_on:
      - aut
